name: Build and Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (hybrid mode)
        run: npm run build
        env:
          ASTRO_BASE: '/'
          ASTRO_SITE: 'https://hvalite-quality.ru'

      - name: Deploy to VPS via SSH/rsync
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST || '2.26.10.12' }}
          USER: ${{ secrets.VPS_USER || 'root' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          # Sync built dist and package files to VPS
          rsync -avz --delete dist/ "${USER}@${HOST}:/var/www/hvalite-quality/dist/"
          scp package.json package-lock.json "${USER}@${HOST}:/var/www/hvalite-quality/"

          # Set permissions, install production dependencies, restart service and reload nginx
          ssh "${USER}@${HOST}" "
            chown -R www-data:www-data /var/www/hvalite-quality/dist
            cd /var/www/hvalite-quality && npm ci --omit=dev
            systemctl restart hvalite-quality
            systemctl reload nginx
          "
